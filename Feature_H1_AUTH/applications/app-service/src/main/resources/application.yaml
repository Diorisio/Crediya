server:
  port: 8080
spring:
  application:
    name: "ReactiveProject"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
    r2dbc:
      host: "localhost"
      port: 3306
      database: "usuario"
      username: "root"
      password: "Albert1879*"

logging:
  file:
    name: logs/miapp.log
  level:
    root: INFO
    org.springframework: INFO
    co.com.pragma: DEBUG
jwt:
  secret-key: aVeryStrongSecretKeyThatIsAtLeast32CharsLong!!
  expiration: 3600   # en segundos (1 hora)
